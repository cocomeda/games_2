<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memory Focus</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Yu Gothic",
    "Meiryo",
    sans-serif;

  background: #ffffff;
  color: #000000;

  min-height: 100vh;

  display: flex;
  justify-content: center;
  align-items: flex-start;

  padding: 24px 16px;
}


/* =========================
   全体
========================= */

.container {
  width: 100%;
  max-width: 540px;

  display: flex;
  flex-direction: column;

  gap: 18px;
}


/* =========================
   タイトルエリア
========================= */

.title-area {
  position: relative;

  width: 100%;

  min-height: 42px;

  display: flex;
  align-items: center;
  justify-content: left;
}


h1 {
  margin: 0;

  text-align: center;

  font-size: 22px;

  line-height: 1.3;

  font-weight: 800;

  letter-spacing: 0.08em;

  color: #000000;
}


/* =========================
   ポイント
========================= */

.point-display {

  position: absolute;

  right: 0;
  top: 50%;

  transform: translateY(-50%);

  padding: 7px 12px;

  background: #ffffff;

  color: #000000;

  font-size: 16px;

  font-weight: 900;

  white-space: nowrap;
}


/* =========================
   設定パネル
========================= */

.settings-panel {

  width: 100%;

  border: 3px solid #000000;

  border-radius: 12px;

  padding: 18px;

  background: #ffffff;
}


.settings {

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 12px;

  margin-bottom: 16px;
}


.setting-item {

  min-width: 0;

  display: flex;

  flex-direction: column;

  gap: 7px;
}


.setting-item label {

  font-size: 16px;

  line-height: 1.3;

  color: #000000;

  font-weight: 800;
}


/* =========================
   プルダウン
========================= */

.setting-item select {

  width: 100%;

  height: 50px;

  padding: 0 10px;

  border: 2px solid #000000;

  border-radius: 8px;

  background: #ffffff;

  color: #000000;

  font-size: 18px;

  font-weight: 700;

  outline: none;
}


.setting-item select:focus {

  border: 4px solid #0057b8;
}


/* =========================
   ボタン
========================= */

.btn {

  width: 100%;

  height: 56px;

  border: 0;

  border-radius: 8px;

  background: #0057b8;

  color: #ffffff;

  font-size: 20px;

  font-weight: 800;

  letter-spacing: 0.05em;

  cursor: pointer;

  transition:
    background 0.15s,
    transform 0.15s;
}


.btn:hover {

  background: #003f88;
}


.btn:active {

  background: #002f66;

  transform: scale(0.98);
}


/* =========================
   メッセージ
========================= */

#message {

  width: 100%;

  min-height: 60px;

  display: flex;

  align-items: center;

  justify-content: center;

  text-align: center;

  padding: 8px 12px;

  border: 3px solid #000000;

  border-radius: 10px;

  font-size: 20px;

  line-height: 1.3;

  font-weight: 900;

  color: #000000;

  background: #ffffff;

  transition:
    background-color 0.2s,
    color 0.2s,
    border-color 0.2s,
    transform 0.2s;

  white-space: pre-line;
}


#message.memorize {

  background: #ffffff;

  border-color: #000000;

  color: #000000;
}


#message.preparing {

  background: #fff4c2;

  border-color: #b47700;

  color: #604000;

  font-size: 23px;

  animation:
    preparingPulse
    1s
    ease-in-out
    infinite;
}


#message.ready {

  background: #d8f3e3;

  border-color: #008a45;

  color: #006b36;

  font-size: 25px;

  animation:
    readyPulse
    0.7s
    ease-in-out
    infinite alternate;
}


#message.success {

  background: #008a45;

  border-color: #005f2e;

  color: #ffffff;

  font-size: 28px;

  transform: scale(1.03);
}


#message.failure {

  background: #ffe0e0;

  border-color: #c00000;

  color: #8b0000;

  font-size: 22px;
}


@keyframes preparingPulse {

  0%,
  100% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.025);
  }

}


@keyframes readyPulse {

  from {
    transform: scale(1);
  }

  to {
    transform: scale(1.04);
  }

}


/* =========================
   ゲーム盤
========================= */

.board-panel {

  width: 100%;

  border: 3px solid #000000;

  border-radius: 12px;

  padding: 12px;

  background: #ffffff;
}


#game-board {

  width: 100%;

  display: grid;

  gap: 10px;

  aspect-ratio: 1 / 1;
}


/* =========================
   タイル
========================= */

.tile {

  position: relative;

  width: 100%;
  height: 100%;

  min-width: 0;
  min-height: 0;

  display: flex;

  align-items: center;
  justify-content: center;

  border: 3px solid #000000;

  border-radius: 8px;

  background: #ffffff;

  color: #000000;

  font-size:
    clamp(24px, 8vw, 42px);

  font-weight: 900;

  line-height: 1;

  user-select: none;

  -webkit-user-select: none;

  cursor: pointer;

  transition:
    background-color 0.15s,
    color 0.15s,
    border-color 0.15s,
    box-shadow 0.15s;
}


.tile.visible {

  background: #ffffff;

  color: #000000;
}


.tile.masked {

  background: #e2e8ee;

  color: transparent;

  border: 4px solid #000000;

  cursor: not-allowed;
}


/* タップ可能になっても黄色くしない */

.tile.ready-to-click {

  background: #ffffff;

  border-color: #000000;

  box-shadow: none;

  cursor: pointer;
}


/* =========================
   正解
========================= */

.tile.correct {

  background: #008a45;

  border-color: #005f2e;

  color: #ffffff;

  cursor: default;

  box-shadow:
    0 0 0 5px #8debb6;

  animation:
    correctTile
    0.45s
    ease-out;
}


.tile.correct::after {

  content: "";

  position: absolute;

  width: 58%;
  height: 58%;

  border: 7px solid #ffffff;

  border-radius: 50%;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%)
    scale(0.2);

  opacity: 0;

  pointer-events: none;

  animation:
    correctCircle
    0.6s
    ease-out;
}


@keyframes correctTile {

  0% {
    transform: scale(0.85);
  }

  55% {
    transform: scale(1.08);
  }

  100% {
    transform: scale(1);
  }

}


@keyframes correctCircle {

  0% {

    transform:
      translate(-50%, -50%)
      scale(0.2);

    opacity: 0;
  }

  20% {
    opacity: 1;
  }

  70% {
    opacity: 1;
  }

  100% {

    transform:
      translate(-50%, -50%)
      scale(1.3);

    opacity: 0;
  }

}


/* =========================
   不正解
========================= */

.tile.wrong {

  background: #d60000;

  border-color: #8b0000;

  color: #ffffff;

  animation:
    wrongTile
    0.35s
    ease-in-out;
}


@keyframes wrongTile {

  0%,
  100% {
    transform: translateX(0);
  }

  25% {
    transform: translateX(-8px);
  }

  75% {
    transform: translateX(8px);
  }

}


.tile.disabled {

  cursor: default;
}


/* =========================
   CLEAR画面
========================= */

.clear-overlay {

  position: fixed;

  inset: 0;

  display: flex;

  align-items: center;

  justify-content: center;

  background:
    rgba(255, 255, 255, 0.94);

  z-index: 100;

  opacity: 0;

  pointer-events: none;

  transition:
    opacity 0.2s;
}


.clear-overlay.show {

  opacity: 1;

  pointer-events: auto;
}


.clear-content {

  text-align: center;

  animation:
    clearAppear
    0.5s
    ease-out;
}


.clear-circle {

  width: 180px;

  height: 180px;

  margin:
    0 auto 20px;

  border:
    14px solid #008a45;

  border-radius: 50%;

  display: flex;

  align-items: center;

  justify-content: center;

  color: #008a45;

  font-size: 78px;

  font-weight: 900;

  background: #ffffff;
}


.clear-text {

  font-size: 44px;

  font-weight: 900;

  color: #000000;

  margin-bottom: 10px;
}


.clear-subtext {

  font-size: 20px;

  font-weight: 700;

  color: #333333;
}


@keyframes clearAppear {

  0% {

    transform: scale(0.7);

    opacity: 0;
  }

  60% {

    transform: scale(1.08);

    opacity: 1;
  }

  100% {

    transform: scale(1);

    opacity: 1;
  }

}


/* =========================
   スマートフォン
========================= */

@media (max-width: 420px) {

  body {

    padding:
      16px 10px;
  }


  .container {

    gap: 14px;
  }


  .title-area {

    min-height: 40px;
  }


  h1 {

    font-size: 24px;
  }


  .point-display {

    font-size: 14px;

    padding:
      6px 8px;

    border-width: 2px;
  }


  .settings-panel {

    padding: 14px;
  }


  .settings {

    gap: 8px;
  }


  .setting-item label {

    font-size: 14px;
  }


  .setting-item select {

    height: 48px;

    font-size: 17px;
  }


  .btn {

    height: 54px;

    font-size: 19px;
  }


  #message {

    font-size: 17px;

    min-height: 56px;
  }


  #message.preparing {

    font-size: 20px;
  }


  #message.ready {

    font-size: 22px;
  }


  #message.success {

    font-size: 25px;
  }


  #message.failure {

    font-size: 20px;
  }


  .board-panel {

    padding: 8px;
  }


  #game-board {

    gap: 7px;
  }


  .tile {

    border-width: 3px;

    border-radius: 6px;

    font-size:
      clamp(22px, 8vw, 34px);
  }


  .tile.correct::after {

    border-width: 5px;
  }


  .clear-circle {

    width: 145px;

    height: 145px;

    border-width: 11px;

    font-size: 58px;
  }


  .clear-text {

    font-size: 35px;
  }


  .clear-subtext {

    font-size: 18px;
  }

}

</style>
</head>


<body>

<div class="container">


  <!-- =====================
       タイトル
  ====================== -->

  <div class="title-area">

    <h1>
       ● Memory Focus
    </h1>

    <div
      id="point-display"
      class="point-display"
    >
      ポイント：0
    </div>

  </div>


  <!-- =====================
       設定
  ====================== -->

  <div class="settings-panel">

    <div class="settings">


      <div class="setting-item">

        <label for="tile-count">
          タイル数
        </label>

        <select id="tile-count">

          <option value="4">
            4
          </option>

          <option value="6">
            6
          </option>

          <option value="9" selected>
            9
          </option>

          <option value="12">
            12
          </option>

          <option value="15">
            15
          </option>

        </select>

      </div>


      <div class="setting-item">

        <label for="show-time">
          表示（秒）
        </label>

        <select id="show-time">

          <option value="1">
            1秒
          </option>

          <option value="2">
            2秒
          </option>

          <option value="3" selected>
            3秒
          </option>

          <option value="4">
            4秒
          </option>

          <option value="5">
            5秒
          </option>

          <option value="6">
            6秒
          </option>

        </select>

      </div>


      <div class="setting-item">

        <label for="hide-time">
          消去（秒）
        </label>

        <select id="hide-time">

          <option value="0">
            0秒
          </option>

          <option value="1">
            1秒
          </option>

          <option value="2" selected>
            2秒
          </option>

          <option value="3">
            3秒
          </option>

          <option value="4">
            4秒
          </option>

        </select>

      </div>

    </div>


    <button
      id="start-btn"
      class="btn"
    >
      START
    </button>

  </div>


  <!-- =====================
       メッセージ
  ====================== -->

  <div id="message">設定してSTARTを押してください
  </div>


  <!-- =====================
       ゲーム盤
  ====================== -->

  <div class="board-panel">

    <div id="game-board"></div>

  </div>

</div>



<!-- =========================
     CLEAR画面
========================== -->

<div
  id="clear-overlay"
  class="clear-overlay"
>

  <div class="clear-content">

    <div class="clear-circle">
      ○
    </div>

    <div class="clear-text">
      CLEAR！
    </div>

    <div class="clear-subtext">
      ポイント獲得！
    </div>

  </div>

</div>



<script>

/* =====================================================
   DOM
===================================================== */

const board =
  document.getElementById(
    "game-board"
  );

const startBtn =
  document.getElementById(
    "start-btn"
  );

const message =
  document.getElementById(
    "message"
  );

const tileCountSelect =
  document.getElementById(
    "tile-count"
  );

const showTimeSelect =
  document.getElementById(
    "show-time"
  );

const hideTimeSelect =
  document.getElementById(
    "hide-time"
  );

const clearOverlay =
  document.getElementById(
    "clear-overlay"
  );

const pointDisplay =
  document.getElementById(
    "point-display"
  );


/* =====================================================
   ゲーム変数
===================================================== */

let currentNumber = 1;

let totalTiles = 9;

let isPlaying = false;

let gameTimers = [];


/*
  累積ポイント

  localStorageに保存するので、
  ページを閉じても基本的に残ります。
*/

let totalPoints =
  parseInt(
    localStorage.getItem(
      "memoryFocusPoints"
    ),
    10
  ) || 0;


/* =====================================================
   グリッド
===================================================== */

const gridCols = {

  4: 2,

  6: 3,

  9: 3,

  12: 4,

  15: 5

};


/* =====================================================
   ポイント表示
===================================================== */

function updatePointDisplay() {

  pointDisplay.textContent =
    `ポイント：${totalPoints}`;

}


/*
  最初の表示
*/

updatePointDisplay();


/* =====================================================
   ポイント加算
===================================================== */

function addPoints(points) {

  totalPoints += points;


  /*
    ブラウザに保存
  */

  localStorage.setItem(
    "memoryFocusPoints",
    totalPoints
  );


  updatePointDisplay();

}


/* =====================================================
   タイマー
===================================================== */

function clearGameTimers() {

  gameTimers.forEach(
    timer => clearTimeout(timer)
  );

  gameTimers = [];

}


function addTimer(
  callback,
  time
) {

  const timer =
    setTimeout(
      () => {

        gameTimers =
          gameTimers.filter(
            t => t !== timer
          );

        callback();

      },
      time
    );


  gameTimers.push(timer);

  return timer;

}


/* =====================================================
   シャッフル
===================================================== */

function shuffle(array) {

  for (
    let i = array.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      array[i],
      array[j]
    ] =
    [
      array[j],
      array[i]
    ];

  }


  return array;

}


/* =====================================================
   連続3数字チェック
===================================================== */

function areConsecutive(
  values
) {

  const sorted =
    [...values].sort(
      (a, b) => a - b
    );


  return (
    sorted[1] ===
      sorted[0] + 1

    &&

    sorted[2] ===
      sorted[1] + 1
  );

}


function hasThreeConsecutiveLine(
  numbers,
  rows,
  cols
) {

  /*
    横
  */

  for (
    let row = 0;
    row < rows;
    row++
  ) {

    for (
      let col = 0;
      col <= cols - 3;
      col++
    ) {

      const values = [

        numbers[
          row * cols + col
        ],

        numbers[
          row * cols + col + 1
        ],

        numbers[
          row * cols + col + 2
        ]

      ];


      if (
        areConsecutive(values)
      ) {

        return true;

      }

    }

  }


  /*
    縦
  */

  for (
    let row = 0;
    row <= rows - 3;
    row++
  ) {

    for (
      let col = 0;
      col < cols;
      col++
    ) {

      const values = [

        numbers[
          row * cols + col
        ],

        numbers[
          (row + 1) * cols + col
        ],

        numbers[
          (row + 2) * cols + col
        ]

      ];


      if (
        areConsecutive(values)
      ) {

        return true;

      }

    }

  }


  return false;

}


/* =====================================================
   安全な配置を作る
===================================================== */

function createSafeArrangement(
  total,
  cols
) {

  const rows =
    Math.ceil(
      total / cols
    );


  for (
    let attempt = 0;
    attempt < 10000;
    attempt++
  ) {

    const numbers =
      Array.from(
        {
          length: total
        },
        (_, i) => i + 1
      );


    shuffle(numbers);


    if (
      !hasThreeConsecutiveLine(
        numbers,
        rows,
        cols
      )
    ) {

      return numbers;

    }

  }


  const numbers =
    Array.from(
      {
        length: total
      },
      (_, i) => i + 1
    );


  return shuffle(numbers);

}


/* =====================================================
   メッセージ
===================================================== */

function setMessage(
  text,
  state = ""
) {

  message.textContent =
    text;


  message.classList.remove(
    "memorize",
    "preparing",
    "ready",
    "success",
    "failure"
  );


  if (state) {

    message.classList.add(
      state
    );

  }

}


/* =====================================================
   ゲーム開始
===================================================== */

function startGame() {

  /*
    途中でも再スタート可能
  */

  clearGameTimers();

  clearOverlay.classList.remove(
    "show"
  );


  isPlaying = true;


  startBtn.disabled = false;

  startBtn.textContent =
    "もう一度";


  /*
    設定取得
  */

  totalTiles =
    parseInt(
      tileCountSelect.value,
      10
    );


  const showTime =
    parseInt(
      showTimeSelect.value,
      10
    ) * 1000;


  const hideTime =
    parseInt(
      hideTimeSelect.value,
      10
    ) * 1000;


  currentNumber = 1;

  board.innerHTML = "";


  /*
    グリッド
  */

  const cols =
    gridCols[totalTiles];


  const rows =
    Math.ceil(
      totalTiles / cols
    );


  board.style.gridTemplateColumns =
    `repeat(${cols}, 1fr)`;


  /*
    安全な配置
  */

  const numbers =
    createSafeArrangement(
      totalTiles,
      cols
    );


  /*
    タイル作成
  */

  numbers.forEach(
    num => {

      const tile =
        document.createElement(
          "div"
        );


      tile.className =
        "tile visible";


      tile.textContent =
        num;


      tile.dataset.number =
        num;


      board.appendChild(
        tile
      );

    }
  );


  setMessage(
    "数字の配置を覚えてください",
    "memorize"
  );


  /*
    表示時間終了
  */

  addTimer(
    () => {

      if (!isPlaying) return;


      const tiles =
        board.querySelectorAll(
          ".tile"
        );


      tiles.forEach(
        tile => {

          tile.classList.remove(
            "visible"
          );

          tile.classList.add(
            "masked"
          );

        }
      );


      setMessage(
        "準備中…",
        "preparing"
      );


      /*
        消去時間終了
      */

      addTimer(
        () => {

          if (!isPlaying) return;


          tiles.forEach(
            tile => {

              tile.classList.add(
                "ready-to-click"
              );


              tile.addEventListener(
                "click",
                handleTileClick
              );

            }
          );


          setMessage(
            "タップできます！\n1から順番にタップしてください",
            "ready"
          );


        },
        hideTime
      );


    },
    showTime
  );

}



/* =====================================================
   タイルクリック
===================================================== */

function handleTileClick(
  event
) {

  if (!isPlaying) return;


  const tile =
    event.currentTarget;


  const tileNum =
    parseInt(
      tile.dataset.number,
      10
    );


  /*
    正解
  */

  if (
    tileNum === currentNumber
  ) {

    tile.classList.remove(
      "masked",
      "ready-to-click"
    );


    tile.classList.add(
      "correct"
    );


    tile.textContent =
      tileNum;


    tile.removeEventListener(
      "click",
      handleTileClick
    );


    /*
      最後の数字まで正解
    */

    if (
      currentNumber ===
      totalTiles
    ) {

      /*
        タイル数と同じポイントを獲得
      */

      addPoints(
        totalTiles
      );


      setMessage(
        `CLEAR！ +${totalTiles}ポイント`,
        "success"
      );


      /*
        クリア画面
      */

      addTimer(
        () => {

          clearOverlay.classList.add(
            "show"
          );


          /*
            クリア画面を3秒表示
          */

          addTimer(
            () => {

              clearOverlay.classList.remove(
                "show"
              );

            },
            3000
          );


        },
        450
      );


      endGame();


    } else {

      currentNumber++;

    }


    return;

  }


  /*
    不正解
  */

  tile.classList.remove(
    "masked",
    "ready-to-click"
  );


  tile.classList.add(
    "wrong"
  );


  tile.textContent =
    tileNum;


  /*
    正解番号は表示しない
  */

  setMessage(
    "GAME OVER",
    "failure"
  );


  endGame();

}


/* =====================================================
   ゲーム終了
===================================================== */

function endGame() {

  isPlaying = false;


  startBtn.disabled = false;

  startBtn.textContent =
    "もう一度";


  const tiles =
    board.querySelectorAll(
      ".tile"
    );


  tiles.forEach(
    tile => {

      tile.classList.remove(
        "masked",
        "visible",
        "ready-to-click"
      );


      tile.classList.add(
        "disabled"
      );


      tile.textContent =
        tile.dataset.number;


      tile.removeEventListener(
        "click",
        handleTileClick
      );

    }
  );

}


/* =====================================================
   CLEAR画面をタップしても閉じられる
===================================================== */

clearOverlay.addEventListener(
  "click",
  () => {

    clearOverlay.classList.remove(
      "show"
    );

  }
);


/* =====================================================
   スタートボタン
===================================================== */

startBtn.addEventListener(
  "click",
  startGame
);

</script>

</body>
