<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>色の変化を探せ！ - Tile Plus / Minus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1226;
    --bg-soft:#161a36;
    --panel:#1c2145;
    --panel-line:#2b3163;
    --ink:#eef0ff;
    --ink-dim:#9aa1cf;
    --accent:#c6ff5e;
    --accent-ink:#0f1226;
    --bad:#ff5d7a;
    --good:#4ee6a6;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 15% -10%, #22265a 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #2a1f4e 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:'Noto Sans JP', sans-serif;
    min-height:100%;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 16px 60px;
  }
  .wrap{
    width:100%;
    max-width:560px;
  }
  header{
    text-align:center;
    margin-bottom:22px;
  }
  header .eyebrow{
    font-size:12px;
    letter-spacing:.24em;
    color:var(--accent);
    font-weight:700;
    text-transform:uppercase;
  }
  header h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(28px,7vw,38px);
    margin:6px 0 0;
    letter-spacing:.01em;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:20px;
    padding:24px;
    box-shadow:0 20px 50px -20px rgba(0,0,0,.6);
  }

  /* ---------- Setup form ---------- */
  .field{margin-bottom:18px;}
  .field label{
    display:block;
    font-size:13px;
    font-weight:700;
    color:var(--ink-dim);
    margin-bottom:8px;
  }
  .num-row{display:flex;align-items:center;gap:12px;}
  .num-row input[type=range]{flex:1;accent-color:var(--accent);}
  .num-row .val{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    min-width:52px;
    text-align:center;
    background:var(--bg-soft);
    border:1px solid var(--panel-line);
    border-radius:10px;
    padding:6px 4px;
    font-size:16px;
  }
  .choice-group{
    display:flex;
    gap:8px;
  }
  .choice-group button{
    flex:1;
    padding:10px 8px;
    border-radius:12px;
    border:1px solid var(--panel-line);
    background:var(--bg-soft);
    color:var(--ink);
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    transition:all .15s ease;
  }
  .choice-group button.active{
    background:var(--accent);
    color:var(--accent-ink);
    border-color:var(--accent);
  }
  .start-btn{
    width:100%;
    margin-top:6px;
    padding:16px;
    border:none;
    border-radius:14px;
    background:var(--accent);
    color:var(--accent-ink);
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:18px;
    letter-spacing:.02em;
    cursor:pointer;
    transition:transform .12s ease;
  }
  .start-btn:hover{transform:translateY(-2px);}
  .start-btn:active{transform:translateY(0);}

  /* ---------- Game screen ---------- */
  .game{display:none;}
  .status-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .phase-label{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:15px;
  }
  .phase-label.memorize{color:var(--accent);}
  .phase-label.hidden{color:var(--ink-dim);}
  .phase-label.answer{color:var(--good);}
  .countdown{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:22px;
    font-variant-numeric:tabular-nums;
  }
  .timebar-track{
    height:6px;
    border-radius:4px;
    background:var(--bg-soft);
    overflow:hidden;
    margin-bottom:18px;
  }
  .timebar-fill{
    height:100%;
    width:100%;
    background:var(--accent);
    transform-origin:left;
    transition:width linear;
  }

  /* Minusモード用：選択肢パレットエリア */
  .options-box{
    display:none;
    background:var(--bg-soft);
    border:1px solid var(--panel-line);
    border-radius:16px;
    padding:14px;
    margin-bottom:18px;
    text-align:center;
  }
  .options-box .options-title{
    font-size:12px;
    color:var(--ink-dim);
    font-weight:700;
    margin-bottom:10px;
  }
  .options-grid{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
  }
  .opt-sq{
    width:44px;
    height:44px;
    border-radius:12px;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,.3);
    transition:transform .12s ease, outline .12s ease;
  }
  .opt-sq:hover{ transform:scale(1.1); }

  .board{
    display:grid;
    gap:12px;
    justify-content:center;
  }
  .sq{
    width:100%;
    aspect-ratio:1/1;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    user-select:none;
    position:relative;
    transition:transform .12s ease, opacity .25s ease, box-shadow .15s ease;
    box-shadow:0 8px 18px -8px rgba(0,0,0,.5);
  }
  .sq.placeholder{
    background:var(--bg-soft) !important;
    border:2px dashed var(--panel-line);
    box-shadow:none;
  }
  .sq.clickable{cursor:pointer;}
  .sq.clickable:hover{transform:translateY(-3px);}
  .sq.correct, .opt-sq.correct{
    outline:4px solid var(--good);
    outline-offset:2px;
  }
  .sq.wrong, .opt-sq.wrong{
    outline:4px solid var(--bad);
    outline-offset:2px;
    animation:shake .32s ease;
  }
  .sq.reveal-pop{animation:pop .28s ease;}
  @keyframes pop{
    0%{transform:scale(.6);opacity:0;}
    100%{transform:scale(1);opacity:1;}
  }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-6px);}
    75%{transform:translateX(6px);}
  }

  .result{
    text-align:center;
    padding:10px 4px 4px;
  }
  .result h2{
    font-family:'Baloo 2', sans-serif;
    font-size:26px;
    margin:6px 0 2px;
  }
  .result.success h2{color:var(--good);}
  .result.fail h2{color:var(--bad);}
  .result p{color:var(--ink-dim);margin:4px 0 18px;font-size:14px;}
  .retry-btn{
    padding:14px 26px;
    border:none;
    border-radius:14px;
    background:var(--accent);
    color:var(--accent-ink);
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:16px;
    cursor:pointer;
  }
  .back-link{
    display:block;
    text-align:center;
    margin-top:14px;
    color:var(--ink-dim);
    font-size:13px;
    cursor:pointer;
    text-decoration:underline;
  }
  .hint{
    text-align:center;
    color:var(--ink-dim);
    font-size:13px;
    margin-top:16px;
    line-height:1.7;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">MEMORY TILE GAME</div>
    <h1>色の変化を探せ！</h1>
  </header>

  <!-- ===== Setup ===== -->
  <div class="card" id="setup">
    <div class="field">
      <label>ゲームモード</label>
      <div class="choice-group">
        <button id="modePlus" class="active" data-mode="plus">増えた色を探す (+1)</button>
        <button id="modeMinus" data-mode="minus">消えた色を探す (-1)</button>
      </div>
    </div>

    <div class="field">
      <label>最初のタイルの数：<span id="countLabel">5</span> 個</label>
      <div class="num-row">
        <input type="range" id="countRange" min="3" max="15" value="5">
      </div>
    </div>

    <div class="field">
      <label>記憶時間（タイルが見えている時間）</label>
      <div class="num-row">
        <input type="range" id="memoRange" min="1" max="10" value="3">
        <div class="val"><span id="memoLabel">3</span>秒</div>
      </div>
    </div>

    <div class="field">
      <label>非表示時間（隠れている時間）</label>
      <div class="num-row">
        <input type="range" id="hideRange" min="1" max="10" value="2">
        <div class="val"><span id="hideLabel">2</span>秒</div>
      </div>
    </div>

    <button class="start-btn" id="startBtn">スタート</button>
    <div class="hint" id="hintText">表示されるタイルの色を覚えてください。非表示のあとに位置がシャッフルされ、<b>【1つだけ新しい色】</b>が追加されて再表示されます。増えた色をタップしてください！</div>
  </div>

  <!-- ===== Game ===== -->
  <div class="card game" id="game">
    <div class="status-bar">
      <div class="phase-label" id="phaseLabel">色をおぼえて！</div>
      <div class="countdown" id="countdown">3</div>
    </div>
    <div class="timebar-track"><div class="timebar-fill" id="timebarFill"></div></div>

    <!-- Minusモード用 選択肢エリア -->
    <div class="options-box" id="optionsBox">
      <div class="options-title">消えたと思う色をタップしてください</div>
      <div class="options-grid" id="optionsGrid"></div>
    </div>

    <div class="board" id="board"></div>
  </div>

  <!-- ===== Result ===== -->
  <div class="card game" id="resultCard">
    <div class="result" id="resultBox">
      <h2 id="resultTitle"></h2>
      <p id="resultDesc"></p>
    </div>
    <div class="board" id="resultBoard" style="margin-bottom:18px;"></div>
    <button class="retry-btn" id="retryBtn" style="width:100%;">もう一度あそぶ</button>
    <div class="back-link" id="backLink">設定を変更する</div>
  </div>
</div>

<script>
(function(){
  // 明確に区別しやすい明確なカラー候補
  const PALETTE = [
    '#ff3b30', '#ff9500', '#ffcc00', '#34c759', '#00c7be',
    '#30b0c7', '#32ade6', '#007aff', '#5856d6', '#af52de',
    '#ff2d55', '#a2845e', '#e5e5ea', '#8e8e93', '#3a3a3c',
    '#7879f1', '#f178b6', '#52d68a', '#ff9f43', '#1dd1a1'
  ];

  const el = id => document.getElementById(id);
  const setup = el('setup'), gameCard = el('game'), resultCard = el('resultCard');
  const countRange = el('countRange'), memoRange = el('memoRange'), hideRange = el('hideRange');
  const countLabel = el('countLabel'), memoLabel = el('memoLabel'), hideLabel = el('hideLabel');
  const modePlusBtn = el('modePlus'), modeMinusBtn = el('modeMinus');
  const board = el('board'), resultBoard = el('resultBoard');
  const phaseLabel = el('phaseLabel'), countdown = el('countdown'), timebarFill = el('timebarFill');
  const optionsBox = el('optionsBox'), optionsGrid = el('optionsGrid');
  const resultBox = el('resultBox'), resultTitle = el('resultTitle'), resultDesc = el('resultDesc');
  const hintText = el('hintText');

  let gameMode = 'plus';
  let initialColors = [];
  let targetColor = '';
  let answerColors = []; 
  let optionsColors = [];
  let timerHandle = null;

  countRange.addEventListener('input', () => countLabel.textContent = countRange.value);
  memoRange.addEventListener('input', () => memoLabel.textContent = memoRange.value);
  hideRange.addEventListener('input', () => hideLabel.textContent = hideRange.value);

  function setGameMode(m){
    gameMode = m;
    modePlusBtn.classList.toggle('active', m === 'plus');
    modeMinusBtn.classList.toggle('active', m === 'minus');
    if(m === 'plus'){
      hintText.innerHTML = '表示されるタイルの色を覚えてください。非表示のあとに位置がシャッフルされ、<b>【1つだけ新しい色】</b>が追加されて再表示されます。増えた色をタップしてください！';
    } else {
      hintText.innerHTML = '表示されるタイルの色を覚えてください。非表示のあとに位置がシャッフルされ、<b>【1つだけ色が削除】</b>されて再表示されます。消えた色を上の選択肢から選んでください！';
    }
  }
  modePlusBtn.addEventListener('click', () => setGameMode('plus'));
  modeMinusBtn.addEventListener('click', () => setGameMode('minus'));

  function shuffle(arr){
    const res = [...arr];
    for(let i = res.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i+1));
      [res[i], res[j]] = [res[j], res[i]];
    }
    return res;
  }

  // --- 色差計算（知覚差フィルター） ---
  function hexToRgb(hex) {
    const c = hex.replace('#', '');
    return {
      r: parseInt(c.substring(0, 2), 16),
      g: parseInt(c.substring(2, 4), 16),
      b: parseInt(c.substring(4, 6), 16)
    };
  }

  function getColorDistance(hex1, hex2) {
    const rgb1 = hexToRgb(hex1);
    const rgb2 = hexToRgb(hex2);
    return Math.sqrt(
      Math.pow(rgb1.r - rgb2.r, 2) +
      Math.pow(rgb1.g - rgb2.g, 2) +
      Math.pow(rgb1.b - rgb2.b, 2)
    );
  }

  // 選ばれた色のリストに対して、十分色差がある色だけを抽出して選出する関数
  function selectDistinctColors(count) {
    const pool = shuffle([...PALETTE]);
    const selected = [];
    const MIN_DISTANCE = 110; // 色差の閾値

    for (let col of pool) {
      if (selected.length === 0) {
        selected.push(col);
      } else {
        const isDistinct = selected.every(sCol => getColorDistance(sCol, col) >= MIN_DISTANCE);
        if (isDistinct) {
          selected.push(col);
        }
      }
      if (selected.length === count) break;
    }

    // もし閾値が高すぎて目標数に達しない場合はフォールバック
    if (selected.length < count) {
      for (let col of pool) {
        if (!selected.includes(col)) {
          selected.push(col);
        }
        if (selected.length === count) break;
      }
    }
    return selected;
  }

  function gridColumns(n){
    return Math.ceil(Math.sqrt(n));
  }

  function buildBoard(){
    const n = parseInt(countRange.value, 10);
    
    if(gameMode === 'plus'){
      const selectedPalette = selectDistinctColors(n + 1);
      initialColors = selectedPalette.slice(0, n);
      targetColor = selectedPalette[n]; 
      answerColors = shuffle([...initialColors, targetColor]);
    } else {
      // Minus モード
      initialColors = selectDistinctColors(n);
      targetColor = initialColors[Math.floor(Math.random() * initialColors.length)];
      answerColors = shuffle(initialColors.filter(c => c !== targetColor));
      
      const unusedPalette = PALETTE.filter(c => !initialColors.includes(c));
      const dummyColor = unusedPalette[Math.floor(Math.random() * unusedPalette.length)] || PALETTE[0];
      optionsColors = shuffle([...initialColors, dummyColor]);
    }

    board.style.gridTemplateColumns = `repeat(${gridColumns(n)}, 1fr)`;
    board.innerHTML = '';
    initialColors.forEach((color) => {
      const d = document.createElement('div');
      d.className = 'sq';
      d.style.background = color;
      board.appendChild(d);
    });
  }

  function runTimer(seconds, onTick, onDone){
    let remaining = seconds;
    countdown.textContent = remaining;
    timebarFill.style.transition = 'none';
    timebarFill.style.width = '100%';
    void timebarFill.offsetWidth;
    timebarFill.style.transition = `width ${seconds}s linear`;
    timebarFill.style.width = '0%';

    if(timerHandle) clearInterval(timerHandle);
    timerHandle = setInterval(() => {
      remaining -= 1;
      if(remaining <= 0){
        clearInterval(timerHandle);
        countdown.textContent = 0;
        onDone && onDone();
      } else {
        countdown.textContent = remaining;
        onTick && onTick(remaining);
      }
    }, 1000);
  }

  function startGame(){
    setup.style.display = 'none';
    resultCard.style.display = 'none';
    gameCard.style.display = 'block';
    optionsBox.style.display = 'none';

    buildBoard();

    phaseLabel.textContent = '色をおぼえて！';
    phaseLabel.className = 'phase-label memorize';

    const memoSec = parseInt(memoRange.value, 10);
    const hideSec = parseInt(hideRange.value, 10);
    runTimer(memoSec, null, startHiddenPhase);

    function startHiddenPhase(){
      phaseLabel.textContent = 'シャッフル中…';
      phaseLabel.className = 'phase-label hidden';
      
      const totalNum = answerColors.length;
      board.style.gridTemplateColumns = `repeat(${gridColumns(totalNum)}, 1fr)`;
      board.innerHTML = '';
      for(let i = 0; i < totalNum; i++){
        const d = document.createElement('div');
        d.className = 'sq placeholder';
        board.appendChild(d);
      }

      runTimer(hideSec, null, startAnswerPhase);
    }

    function startAnswerPhase(){
      countdown.textContent = '';
      timebarFill.style.transition = 'none';
      timebarFill.style.width = '0%';

      if(gameMode === 'plus'){
        phaseLabel.textContent = '増えた色をタップ！';
        phaseLabel.className = 'phase-label answer';

        board.innerHTML = '';
        answerColors.forEach(color => {
          const d = document.createElement('div');
          d.className = 'sq clickable reveal-pop';
          d.style.background = color;
          d.onclick = () => handleTap(color, d);
          board.appendChild(d);
        });
      } else {
        phaseLabel.textContent = '消えた色を選んでタップ！';
        phaseLabel.className = 'phase-label answer';

        optionsBox.style.display = 'block';
        optionsGrid.innerHTML = '';
        optionsColors.forEach(color => {
          const opt = document.createElement('div');
          opt.className = 'opt-sq';
          opt.style.background = color;
          opt.onclick = () => handleTap(color, opt);
          optionsGrid.appendChild(opt);
        });

        board.innerHTML = '';
        answerColors.forEach(color => {
          const d = document.createElement('div');
          d.className = 'sq reveal-pop';
          d.style.background = color;
          board.appendChild(d);
        });
      }
    }
  }

  function handleTap(selectedColor, elTarget){
    if(selectedColor === targetColor){
      elTarget.classList.add('correct');
      setTimeout(() => finishGame(true), 400);
    } else {
      elTarget.classList.add('wrong');
      setTimeout(() => finishGame(false, selectedColor), 400);
    }
  }

  function finishGame(success, wrongColor){
    if(timerHandle) clearInterval(timerHandle);
    gameCard.style.display = 'none';
    resultCard.style.display = 'block';

    resultBox.className = 'result ' + (success ? 'success' : 'fail');
    resultTitle.textContent = success ? '正解！🎉' : '不正解…';
    
    if(gameMode === 'plus'){
      resultDesc.textContent = success
        ? `見事、新しく追加された色を見抜くことができました！`
        : '元からあった色を選択してしまいました。枠線で囲まれたのが追加された色です。';

      resultBoard.style.gridTemplateColumns = `repeat(${gridColumns(answerColors.length)}, 1fr)`;
      resultBoard.innerHTML = '';
      answerColors.forEach(color => {
        const d = document.createElement('div');
        d.className = 'sq';
        d.style.background = color;
        if(color === targetColor) d.classList.add('correct');
        else if(!success && color === wrongColor) d.classList.add('wrong');
        resultBoard.appendChild(d);
      });
    } else {
      resultDesc.textContent = success
        ? `見事、消えた色を見抜くことができました！`
        : '違う色を選んでしまいました。正解の消えた色は枠線で囲まれたタイルです。';

      resultBoard.style.gridTemplateColumns = `repeat(${gridColumns(initialColors.length)}, 1fr)`;
      resultBoard.innerHTML = '';
      initialColors.forEach(color => {
        const d = document.createElement('div');
        d.className = 'sq';
        d.style.background = color;
        if(color === targetColor) d.classList.add('correct');
        else if(!success && color === wrongColor) d.classList.add('wrong');
        resultBoard.appendChild(d);
      });
    }
  }

  el('startBtn').addEventListener('click', startGame);
  el('retryBtn').addEventListener('click', startGame);
  el('backLink').addEventListener('click', () => {
    resultCard.style.display = 'none';
    gameCard.style.display = 'none';
    setup.style.display = 'block';
  });

})();
</script>
</body>
</html>
