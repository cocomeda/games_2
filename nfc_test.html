<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>記憶の正方形</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>

:root{

--bg:#0f1226;

--bg-soft:#161a36;

--panel:#1c2145;

--panel-line:#2b3163;

--ink:#eef0ff;

--ink-dim:#9aa1cf;

--accent:#c6ff5e;

--accent-ink:#0f1226;

--bad:#ff5d7a;

--good:#4ee6a6;

}

*{box-sizing:border-box;}

html,body{height:100%;}

body{

margin:0;

background:

radial-gradient(1200px 600px at 15% -10%, #22265a 0%, transparent 60%),

radial-gradient(900px 500px at 110% 10%, #2a1f4e 0%, transparent 55%),

var(--bg);

color:var(--ink);

font-family:'Noto Sans JP', sans-serif;

min-height:100%;

display:flex;

align-items:flex-start;

justify-content:center;

padding:32px 16px 60px;

}

.wrap{

width:100%;

max-width:560px;

}

header{

text-align:center;

margin-bottom:22px;

}

header .eyebrow{

font-size:12px;

letter-spacing:.24em;

color:var(--accent);

font-weight:700;

text-transform:uppercase;

}

header h1{

font-family:'Baloo 2', sans-serif;

font-weight:800;

font-size:clamp(28px,7vw,38px);

margin:6px 0 0;

letter-spacing:.01em;

}

.card{

background:var(--panel);

border:1px solid var(--panel-line);

border-radius:20px;

padding:24px;

box-shadow:0 20px 50px -20px rgba(0,0,0,.6);

}



/* ---------- Setup form ---------- */

.field{margin-bottom:18px;}

.field label{

display:block;

font-size:13px;

font-weight:700;

color:var(--ink-dim);

margin-bottom:8px;

}

.num-row{display:flex;align-items:center;gap:12px;}

.num-row input[type=range]{flex:1;accent-color:var(--accent);}

.num-row .val{

font-family:'Baloo 2', sans-serif;

font-weight:700;

min-width:52px;

text-align:center;

background:var(--bg-soft);

border:1px solid var(--panel-line);

border-radius:10px;

padding:6px 4px;

font-size:16px;

}

.choice-group{

display:flex;

gap:8px;

}

.choice-group button{

flex:1;

padding:10px 8px;

border-radius:12px;

border:1px solid var(--panel-line);

background:var(--bg-soft);

color:var(--ink);

font-family:inherit;

font-size:13px;

font-weight:700;

cursor:pointer;

transition:all .15s ease;

}

.choice-group button.active{

background:var(--accent);

color:var(--accent-ink);

border-color:var(--accent);

}

.start-btn{

width:100%;

margin-top:6px;

padding:16px;

border:none;

border-radius:14px;

background:var(--accent);

color:var(--accent-ink);

font-family:'Baloo 2', sans-serif;

font-weight:800;

font-size:18px;

letter-spacing:.02em;

cursor:pointer;

transition:transform .12s ease;

}

.start-btn:hover{transform:translateY(-2px);}

.start-btn:active{transform:translateY(0);}



/* ---------- Game screen ---------- */

.game{display:none;}

.status-bar{

display:flex;

align-items:center;

justify-content:space-between;

margin-bottom:14px;

}

.phase-label{

font-family:'Baloo 2', sans-serif;

font-weight:700;

font-size:15px;

}

.phase-label.memorize{color:var(--accent);}

.phase-label.hidden{color:var(--ink-dim);}

.phase-label.answer{color:var(--good);}

.countdown{

font-family:'Baloo 2', sans-serif;

font-weight:800;

font-size:22px;

font-variant-numeric:tabular-nums;

}

.timebar-track{

height:6px;

border-radius:4px;

background:var(--bg-soft);

overflow:hidden;

margin-bottom:18px;

}

.timebar-fill{

height:100%;

width:100%;

background:var(--accent);

transform-origin:left;

transition:width linear;

}



/* ターゲット数字表示エリア */

.target-box{

display:none;

text-align:center;

background:var(--bg-soft);

border:1px solid var(--panel-line);

border-radius:16px;

padding:10px;

margin-bottom:16px;

}

.target-box .target-sub{

font-size:12px;

color:var(--ink-dim);

font-weight:700;

}

.target-box .target-num{

font-family:'Baloo 2', sans-serif;

font-size:36px;

font-weight:800;

color:var(--accent);

line-height:1.1;

}



.progress-dots{

display:flex;

flex-wrap:wrap;

gap:6px;

justify-content:center;

margin-bottom:18px;

min-height:26px;

}

.progress-dots .dot{

width:26px;height:26px;

border-radius:50%;

background:var(--bg-soft);

border:1px solid var(--panel-line);

display:flex;align-items:center;justify-content:center;

font-family:'Baloo 2', sans-serif;

font-weight:700;

font-size:12px;

color:var(--ink-dim);

transition:all .2s ease;

}

.progress-dots .dot.done{

background:var(--good);

border-color:var(--good);

color:var(--accent-ink);

transform:scale(1.08);

}



.board{

display:grid;

gap:12px;

justify-content:center;

}

.sq{

width:100%;

aspect-ratio:1/1;

border-radius:18px;

display:flex;

align-items:center;

justify-content:center;

font-family:'Baloo 2', sans-serif;

font-weight:800;

color:#ffffff;

user-select:none;

position:relative;

transition:transform .12s ease, opacity .25s ease, box-shadow .15s ease;

box-shadow:0 8px 18px -8px rgba(0,0,0,.6);

/* 縁（ボーダー）を追加 */

border:5px solid transparent;

}

.sq .n{

font-size:clamp(26px,9vw,44px);

font-weight:800;

line-height:1;

text-shadow:0 2px 4px rgba(0,0,0,.6);

-webkit-text-stroke:1px rgba(0,0,0,.7);

}

.sq.placeholder{

background:var(--bg-soft) !important;

border:2px dashed var(--panel-line) !important;

box-shadow:none;

}

.sq.clickable{cursor:pointer;}

.sq.clickable:hover{transform:translateY(-3px);}

.sq.correct{

outline:4px solid var(--good);

outline-offset:3px;

}

.sq.wrong{

outline:4px solid var(--bad);

outline-offset:3px;

animation:shake .32s ease;

}

.sq.locked{cursor:default;opacity:.55;}

.sq.reveal-pop{animation:pop .28s ease;}

@keyframes pop{

0%{transform:scale(.6);opacity:0;}

100%{transform:scale(1);opacity:1;}

}

@keyframes shake{

0%,100%{transform:translateX(0);}

25%{transform:translateX(-6px);}

75%{transform:translateX(6px);}

}



.result{

text-align:center;

padding:10px 4px 4px;

}

.result h2{

font-family:'Baloo 2', sans-serif;

font-size:26px;

margin:6px 0 2px;

}

.result.success h2{color:var(--good);}

.result.fail h2{color:var(--bad);}

.result p{color:var(--ink-dim);margin:4px 0 18px;font-size:14px;}

.retry-btn{

padding:14px 26px;

border:none;

border-radius:14px;

background:var(--accent);

color:var(--accent-ink);

font-family:'Baloo 2', sans-serif;

font-weight:800;

font-size:16px;

cursor:pointer;

}

.back-link{

display:block;

text-align:center;

margin-top:14px;

color:var(--ink-dim);

font-size:13px;

cursor:pointer;

text-decoration:underline;

}

.hint{

text-align:center;

color:var(--ink-dim);

font-size:13px;

margin-top:16px;

line-height:1.7;

}

</style>

</head>

<body>

<div class="wrap">

<header>

<div class="eyebrow">MEMORY SQUARES</div>

<h1>記憶の正方形</h1>

</header>



<!-- ===== Setup ===== -->

<div class="card" id="setup">

<div class="field">

<label>正方形の数：<span id="countLabel">6</span> 個</label>

<div class="num-row">

<input type="range" id="countRange" min="3" max="20" value="6">

</div>

</div>



<div class="field">

<label>記憶時間（数字が見えている時間）</label>

<div class="num-row">

<input type="range" id="memoRange" min="1" max="15" value="3">

<div class="val"><span id="memoLabel">3</span>秒</div>

</div>

</div>



<div class="field">

<label>非表示時間（何も見えない時間）</label>

<div class="num-row">

<input type="range" id="hideRange" min="1" max="15" value="2">

<div class="val"><span id="hideLabel">2</span>秒</div>

</div>

</div>



<div class="field">

<label>数字の範囲</label>

<div class="choice-group">

<button id="modeWide" class="active" data-mode="wide">1〜99からランダム</button>

<button id="modeCount" data-mode="count">1〜個数（例:8個なら1〜8）</button>

</div>

</div>



<button class="start-btn" id="startBtn">スタート</button>

<div class="hint">数字は色つきの正方形の上に一瞬だけ表示されます。配置を覚えて、上部に表示される指定の数字に対応するタイルをタップしてください。</div>

</div>



<!-- ===== Game ===== -->

<div class="card game" id="game">

<div class="status-bar">

<div class="phase-label" id="phaseLabel">おぼえて！</div>

<div class="countdown" id="countdown">3</div>

</div>

<div class="timebar-track"><div class="timebar-fill" id="timebarFill"></div></div>


<!-- ターゲット数字の表示領域 -->

<div class="target-box" id="targetBox">

<div class="target-sub">TARGET</div>

<div class="target-num" id="targetNum">-</div>

</div>



<div class="progress-dots" id="progressDots"></div>

<div class="board" id="board"></div>

</div>



<!-- ===== Result ===== -->

<div class="card game" id="resultCard">

<div class="result" id="resultBox">

<h2 id="resultTitle"></h2>

<p id="resultDesc"></p>

</div>

<div class="board" id="resultBoard" style="margin-bottom:18px;"></div>

<button class="retry-btn" id="retryBtn" style="width:100%;">もう一度あそぶ</button>

<div class="back-link" id="backLink">設定を変更する</div>

</div>

</div>



<script>

(function(){

// 背景色と縁（ボーダー）色の組み合わせセット

const COLOR_PAIRS = [

{ bg: '#ff4757', border: '#ff7f50' },

{ bg: '#2ed573', border: '#7bed9f' },

{ bg: '#1e90ff', border: '#70a1ff' },

{ bg: '#ffa502', border: '#eccc68' },

{ bg: '#9b59b6', border: '#be2edd' },

{ bg: '#00d2d3', border: '#48dbfb' },

{ bg: '#ff6b81', border: '#ff80ab' },

{ bg: '#30336b', border: '#535c68' },

{ bg: '#6ab04c', border: '#badc58' },

{ bg: '#eb4d4b', border: '#ff7979' },

{ bg: '#222f3e', border: '#576574' },

{ bg: '#f39c12', border: '#f1c40f' },

{ bg: '#8e44ad', border: '#9b59b6' },

{ bg: '#16a085', border: '#1abc9c' },

{ bg: '#d35400', border: '#e67e22' },

{ bg: '#2980b9', border: '#3498db' },

{ bg: '#27ae60', border: '#2ecc71' },

{ bg: '#c0392b', border: '#e74c3c' },

{ bg: '#bdc3c7', border: '#ffffff' },

{ bg: '#7f8c8d', border: '#95a5a6' }

];



const el = id => document.getElementById(id);

const setup = el('setup'), gameCard = el('game'), resultCard = el('resultCard');

const countRange = el('countRange'), memoRange = el('memoRange'), hideRange = el('hideRange');

const countLabel = el('countLabel'), memoLabel = el('memoLabel'), hideLabel = el('hideLabel');

const modeWideBtn = el('modeWide'), modeCountBtn = el('modeCount');

const board = el('board'), resultBoard = el('resultBoard');

const phaseLabel = el('phaseLabel'), countdown = el('countdown'), timebarFill = el('timebarFill');

const targetBox = el('targetBox'), targetNum = el('targetNum');

const progressDots = el('progressDots');

const resultBox = el('resultBox'), resultTitle = el('resultTitle'), resultDesc = el('resultDesc');



let mode = 'wide';

let squares = []; // {number, colorPair}

let targetOrder = [];

let currentTargetIdx = 0;

let timerHandle = null;

let answerOrder = [];



countRange.addEventListener('input', () => countLabel.textContent = countRange.value);

memoRange.addEventListener('input', () => memoLabel.textContent = memoRange.value);

hideRange.addEventListener('input', () => hideLabel.textContent = hideRange.value);



function setMode(m){

mode = m;

modeWideBtn.classList.toggle('active', m === 'wide');

modeCountBtn.classList.toggle('active', m === 'count');

}

modeWideBtn.addEventListener('click', () => setMode('wide'));

modeCountBtn.addEventListener('click', () => setMode('count'));



function shuffle(arr){

const res = [...arr];

for(let i = res.length - 1; i > 0; i--){

const j = Math.floor(Math.random() * (i+1));

[res[i], res[j]] = [res[j], res[i]];

}

return res;

}



// --- 色計算用（RGB距離算出） ---

function hexToRgb(hex) {

const c = hex.replace('#', '');

return {

r: parseInt(c.substring(0, 2), 16),

g: parseInt(c.substring(2, 4), 16),

b: parseInt(c.substring(4, 6), 16)

};

}



function getColorDistance(hex1, hex2) {

const rgb1 = hexToRgb(hex1);

const rgb2 = hexToRgb(hex2);

return Math.sqrt(

Math.pow(rgb1.r - rgb2.r, 2) +

Math.pow(rgb1.g - rgb2.g, 2) +

Math.pow(rgb1.b - rgb2.b, 2)

);

}



// 被りにくいカラーペアの抽出関数

function selectDistinctColorPairs(count) {

const pool = shuffle([...COLOR_PAIRS]);

const selected = [];

const MIN_DISTANCE = 90;



for (let pair of pool) {

if (selected.length === 0) {

selected.push(pair);

} else {

const isDistinct = selected.every(sPair => getColorDistance(sPair.bg, pair.bg) >= MIN_DISTANCE);

if (isDistinct) {

selected.push(pair);

}

}

if (selected.length === count) break;

}



// 目標数に届かない場合のフォールバック

if (selected.length < count) {

for (let pair of pool) {

if (!selected.includes(pair)) {

selected.push(pair);

}

if (selected.length === count) break;

}

}

return selected;

}



function pickNumbers(n){

if(mode === 'count'){

return shuffle(Array.from({length:n}, (_,i) => i+1));

}

const set = new Set();

while(set.size < n){

set.add(1 + Math.floor(Math.random() * 99));

}

return shuffle([...set]);

}



function gridColumns(n){

return Math.ceil(Math.sqrt(n));

}



function buildBoard(){

const n = parseInt(countRange.value, 10);

const numbers = pickNumbers(n);

const selectedPairs = selectDistinctColorPairs(n);


squares = numbers.map((num, i) => ({

number: num,

colorPair: selectedPairs[i]

}));


targetOrder = shuffle(numbers);

currentTargetIdx = 0;



board.style.gridTemplateColumns = `repeat(${gridColumns(n)}, 1fr)`;

board.innerHTML = '';

squares.forEach((sq, idx) => {

const d = document.createElement('div');

d.className = 'sq';

d.style.background = sq.colorPair.bg;

d.style.borderColor = sq.colorPair.border;

d.dataset.idx = idx;

board.appendChild(d);

});

}



function renderProgressDots(){

progressDots.innerHTML = '';

targetOrder.forEach((num, i) => {

const dot = document.createElement('div');

dot.className = 'dot';

dot.textContent = num;

dot.dataset.slot = i;

progressDots.appendChild(dot);

});

}



function updateTargetDisplay(){

if(currentTargetIdx < targetOrder.length){

targetNum.textContent = targetOrder[currentTargetIdx];

}

}



function showNumbers(show){

[...board.children].forEach((d, idx) => {

if(show){

d.innerHTML = `<span class="n">${squares[idx].number}</span>`;

} else {

d.innerHTML = '';

}

});

}



function runTimer(seconds, onTick, onDone){

let remaining = seconds;

countdown.textContent = remaining;

timebarFill.style.transition = 'none';

timebarFill.style.width = '100%';

void timebarFill.offsetWidth;

timebarFill.style.transition = `width ${seconds}s linear`;

timebarFill.style.width = '0%';



if(timerHandle) clearInterval(timerHandle);

timerHandle = setInterval(() => {

remaining -= 1;

if(remaining <= 0){

clearInterval(timerHandle);

countdown.textContent = 0;

onDone && onDone();

} else {

countdown.textContent = remaining;

onTick && onTick(remaining);

}

}, 1000);

}



function startGame(){

setup.style.display = 'none';

resultCard.style.display = 'none';

gameCard.style.display = 'block';

targetBox.style.display = 'none';



buildBoard();

renderProgressDots();



// Phase 1: memorize

phaseLabel.textContent = 'おぼえて！';

phaseLabel.className = 'phase-label memorize';

showNumbers(true);

[...board.children].forEach(d => d.classList.remove('clickable','placeholder','correct','wrong','locked'));



const memoSec = parseInt(memoRange.value, 10);

const hideSec = parseInt(hideRange.value, 10);

runTimer(memoSec, null, startHiddenPhase);



function startHiddenPhase(){

phaseLabel.textContent = 'わすれないで…';

phaseLabel.className = 'phase-label hidden';

[...board.children].forEach(d => {

d.innerHTML = '';

d.style.background = '';

d.style.borderColor = 'transparent';

d.classList.add('placeholder');

});

runTimer(hideSec, null, startAnswerPhase);

}



function startAnswerPhase(){

phaseLabel.textContent = '指定の数字の色をタップ！';

phaseLabel.className = 'phase-label answer';

countdown.textContent = '';

timebarFill.style.transition = 'none';

timebarFill.style.width = '0%';



targetBox.style.display = 'block';

updateTargetDisplay();



answerOrder = shuffle(squares.map((_, i) => i));

board.innerHTML = '';

answerOrder.forEach(idx => {

const d = document.createElement('div');

d.className = 'sq clickable reveal-pop';

d.style.background = squares[idx].colorPair.bg;

d.style.borderColor = squares[idx].colorPair.border;

d.dataset.idx = idx;

d.onclick = () => handleTap(idx, d);

board.appendChild(d);

});

}

}



function handleTap(idx, d){

if(d.classList.contains('locked')) return;

const num = squares[idx].number;

const expected = targetOrder[currentTargetIdx];



if(num === expected){

d.classList.add('correct','locked');

d.classList.remove('clickable');

d.innerHTML = `<span class="n">${num}</span>`;

d.onclick = null;



const dot = progressDots.querySelector(`.dot[data-slot="${currentTargetIdx}"]`);

if(dot) dot.classList.add('done');



currentTargetIdx++;

if(currentTargetIdx === targetOrder.length){

setTimeout(() => finishGame(true), 350);

} else {

updateTargetDisplay();

}

} else {

d.classList.add('wrong');

setTimeout(() => finishGame(false, idx), 300);

}

}



function finishGame(success, wrongIdx){

if(timerHandle) clearInterval(timerHandle);

gameCard.style.display = 'none';

resultCard.style.display = 'block';



resultBox.className = 'result ' + (success ? 'success' : 'fail');

resultTitle.textContent = success ? 'クリア！🎉' : 'ざんねん…';

resultDesc.textContent = success

? `${squares.length}個の数字の色をすべて正しく選択できました！`

: '違う数字の色をタップしてしまいました。正解の配置を確認してみましょう。';



resultBoard.style.gridTemplateColumns = `repeat(${gridColumns(squares.length)}, 1fr)`;

resultBoard.innerHTML = '';

answerOrder.forEach(idx => {

const sq = squares[idx];

const d = document.createElement('div');

d.className = 'sq';

d.style.background = sq.colorPair.bg;

d.style.borderColor = sq.colorPair.border;

d.innerHTML = `<span class="n">${sq.number}</span>`;

if(!success && idx === wrongIdx) d.classList.add('wrong');

resultBoard.appendChild(d);

});

}



el('startBtn').addEventListener('click', startGame);

el('retryBtn').addEventListener('click', startGame);

el('backLink').addEventListener('click', () => {

resultCard.style.display = 'none';

gameCard.style.display = 'none';

setup.style.display = 'block';

});



})();

</script>

</body>

</html>
